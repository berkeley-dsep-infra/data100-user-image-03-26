name: data100-FA23

channels:
  - conda-forge
  - pytorch

dependencies:
  # Crucial: Pin python so the solver doesn't evaluate every Python release
  - python=3.11

  # Basic functionality
  - git-lfs==3.7.1

  # Packages
  - altair==6.2.2
  - duckdb==1.3.2
  - duckdb-engine==0.15.0
  - folium==0.19.7
  - hvplot==0.12.2
  - ipykernel==6.31.0
  - jupysql==0.11.1
  - libclang==18.1.8
  - mdit-py-plugins==0.4.2
  - ml_dtypes==0.4.0
  - mlxtend==0.23.4
  - polars==1.43.2
  - protobuf==5.27.5
  - pytest-notebook==0.10.0
  - requests==2.32.5
  - scikit-image==0.25.2
  - sqlalchemy==2.0.49
  - tensorboard==2.17.1
  - tensorflow-cpu==2.17.0
  - tf-keras==2.17.0
  
  # PyTorch & ML
  - cpuonly==2.0
  - pytorch==2.5.1
  - transformers==4.52.4

  # Additional
  - lxml==5.4.0
  - geopandas==1.1.4
  - geopy==2.4.1

  # Pip dependencies
  - pip
  - pip:
      # DH-747, mamba resolver hangs if pyarrow is specified above
      - pyarrow==25.0.0
      - git+https://github.com/shaneknapp/python-popularity-contest.git@add-error-handling
      - otter-pensieve==1.6.0
      - jupyterlab-a11y-checker==0.2.8
